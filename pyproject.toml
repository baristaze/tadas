[project]
name = "tadas-workspace"
version = "0.1.0"
description = "Tadas: a multi-tenant to-do application for teams of people and the programs that work alongside them."
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
# Every member ships a subpackage of the one root package `tadas` (ADR 0001).
members = [
    "om",
    "infra",
    "services/api",
    "workers/maintenance",
    "clients/python",
    "apps/cli",
]

[tool.uv.sources]
tadas-om = { workspace = true }
tadas-infra = { workspace = true }
tadas-api = { workspace = true }
tadas-maintenance = { workspace = true }
tadas-client = { workspace = true }
tadas-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
    "httpx>=0.28.1",
    # Pinned exactly: `make openapi` regenerates clients/python/src/tadas/client/schema.py
    # with it and CI checks the committed file is current.
    "datamodel-code-generator==0.82.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = [
    "om/tests",
    "services/api/tests",
    "workers/maintenance/tests",
    "clients/python/tests",
    "apps/cli/tests",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "om/tests",
    "infra/tests",
    "services/api/tests",
    "workers/maintenance/tests",
    "clients/python/tests",
    "apps/cli/tests",
]
markers = [
    "integration: needs the local compose stack",
    "e2e: drives a running system end to end",
    "slow: takes more than a few seconds",
]
