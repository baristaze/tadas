[project]
name = "tadas-workspace"
version = "0.1.0"
description = "Tadas: a multi-tenant to-do application for teams of people and the programs that work alongside them."
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
# Every member ships a subpackage of the one root package `tadas` (ADR 0001).
members = [
    "om",
    "infra",
    "services/api",
    "workers/maintenance",
    "clients/python",
    "apps/cli",
    "ops",
]

[tool.uv.sources]
tadas-om = { workspace = true }
tadas-infra = { workspace = true }
tadas-api = { workspace = true }
tadas-maintenance = { workspace = true }
tadas-client = { workspace = true }
tadas-cli = { workspace = true }
tadas-ops = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
    "httpx>=0.28.1",
    # Pinned exactly: `make openapi` regenerates clients/python/src/tadas/client/schema.py
    # with it and CI checks the committed file is current.
    "datamodel-code-generator==0.82.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = [
    "om/tests",
    "services/api/tests",
    "workers/maintenance/tests",
    "clients/python/tests",
    "apps/cli/tests",
    "ops/tests",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "om/tests",
    "infra/tests",
    "services/api/tests",
    "workers/maintenance/tests",
    "clients/python/tests",
    "apps/cli/tests",
    "ops/tests",
]
markers = [
    "integration: needs the local compose stack",
    "slow: takes more than a few seconds",
    "telemetry: needs the devx profile",
]

# The guideline's static checker (`make arch-check`). The layout is the
# guideline's, so only the package and the project's own lists are named.
[tool.arch-check]
package = "tadas"

# A revoked key's hash stays refused; the lookup reads revoked keys to
# answer "revoked".
[[tool.arch-check.exception]]
rule = "STO-26"
path = "om/src/tadas/om/tenancy/storage/tables/api_keys.py"
adr = "docs/adr/0019-an-api-key-hash-stays-unique-after-revocation.md"
reason = "an api key hash digests a fresh random secret and the lookup reads revoked keys too"

# The storage methods that take no tenant, the same list
# om/tests/unit/test_storage_exceptions.py holds.
[tool.arch-check.options.CTX-12]
tenantless = [
    "EventStorageInterface.count_since",
    "OutboxStorageInterface.claim_pending",
    "OutboxStorageInterface.purge_done",
    "TasksStorageInterface.count_created_since",
    "TenancyStorageInterface.clear_failed_sign_ins",
    "TenancyStorageInterface.consume_socket_ticket",
    "TenancyStorageInterface.count_orgs",
    "TenancyStorageInterface.count_users",
    "TenancyStorageInterface.read_api_key_by_hash",
    "TenancyStorageInterface.read_identity",
    "TenancyStorageInterface.read_identity_by_email",
    "TenancyStorageInterface.read_memberships_by_identity",
    "TenancyStorageInterface.read_org_by_slug",
    "TenancyStorageInterface.read_orgs",
    "TenancyStorageInterface.read_session_by_id",
    "TenancyStorageInterface.read_session_by_token_hash",
    "TenancyStorageInterface.read_users_by_identity",
    "TenancyStorageInterface.record_failed_sign_in",
    "TenancyStorageInterface.write_identity",
    "WorkStorageInterface.claim_next",
    "WorkStorageInterface.purge_items",
]

# The sites that build a stage above the request stage, the same list
# om/tests/unit/test_stage_construction.py holds: the helper that assembles
# a tenant context and the tenancy manager's transitions.
[tool.arch-check.options.CTX-26]
sites = [
    "om/src/tadas/om/opcontext.py::build_context",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.bootstrap",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.add_member",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.authenticate_login",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.authenticate",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.admit_operator",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.resume",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.service_context",
    "om/src/tadas/om/tenancy/impl/manager.py::TenancyManagerImpl.service_contexts",
]
builders = ["build_context"]
