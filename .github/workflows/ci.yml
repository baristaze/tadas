name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; main keeps
# every run, since deploy-staging.yml follows each successful one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv sync and uv run fail instead of rewriting a stale uv.lock.
  UV_LOCKED: "1"

jobs:
  check:
    name: fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action in every workflow is pinned by commit, and the comment
      # names the release that commit carries. A tag moves, and the deploy
      # workflows hand an action the credential that reaches the cloud, so a
      # tag is a name someone else can repoint. The comment is the version
      # the bump reads and raises; the commit is what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make setup
      - run: make check
      - name: the apps build
        run: pnpm run build
      - name: the committed OpenAPI document is current
        run: make openapi && git diff --exit-code

  integration:
    name: integration over the compose stack
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --all-packages
      - run: cp .env.example .env
      - run: make infra-up
      - run: make migrate
      - name: every role's ORM metadata matches the migrated schema
        run: make migrate-check
      - run: make test-integration
      - run: make infra-down
        if: always()

  telemetry:
    name: the telemetry round trip over the devx profile
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --all-packages
      - run: cp .env.example .env
      # The data services and the dashboards. `up --wait` holds until every
      # healthcheck passes, GlitchTip's included, and then reports the seed's
      # clean exit (a one-shot service) as a failure, so the seed's own exit
      # code and GlitchTip's health are read back instead of the wait's.
      - name: the compose stack with the devx profile
        run: |
          make devx-up || true
          test "$(docker inspect -f '{{.State.Health.Status}}' tadas-glitchtip-1)" = healthy
          test "$(docker inspect -f '{{.State.ExitCode}}' tadas-glitchtip-seed-1)" = 0
          docker logs tadas-glitchtip-seed-1 | tail -n 1
      - run: make migrate seed
      - run: make test-telemetry
      - name: the API on 8000 for the traffic run
        run: |
          nohup uv run tadas-api serve > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
      - run: make traffic PROFILE=light DURATION=30
      - name: the API's log, on a failure
        if: failure()
        run: tail -n 100 api.log || true
      - run: make down
        if: always()

  images:
    name: images build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    strategy:
      matrix:
        image: [api, maintenance, portal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build ${{ matrix.image }} without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  terraform:
    name: terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        root: [shared, environments/staging, environments/prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
      - run: terraform fmt -check -recursive deployment/terraform
      - run: terraform -chdir=deployment/terraform/${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=deployment/terraform/${{ matrix.root }} validate
      - if: matrix.root == 'shared'
        run: terraform -chdir=deployment/terraform/modules/portal init -backend=false -input=false
      - if: matrix.root == 'shared'
        run: terraform -chdir=deployment/terraform/modules/portal test
      - if: matrix.root == 'environments/staging'
        run: terraform -chdir=deployment/terraform/modules/service init -backend=false -input=false
      - if: matrix.root == 'environments/staging'
        run: terraform -chdir=deployment/terraform/modules/service test
