name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make setup
      - run: make check
      - name: the committed OpenAPI document is current
        run: make openapi && git diff --exit-code

  integration:
    name: integration over the compose stack
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: cp .env.example .env
      - run: make infra-up
      - run: make migrate
      - run: make test-integration
      - run: make infra-down
        if: always()
