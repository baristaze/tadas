name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; main keeps
# every run, since deploy.yml follows each successful one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv sync and uv run fail instead of rewriting a stale uv.lock.
  UV_LOCKED: "1"

jobs:
  check:
    name: fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make setup
      - run: make check
      - name: the apps build
        run: pnpm run build
      - name: the committed OpenAPI document is current
        run: make openapi && git diff --exit-code

  integration:
    name: integration over the compose stack
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --all-packages
      - run: cp .env.example .env
      - run: make infra-up
      - run: make migrate
      - name: every role's ORM metadata matches the migrated schema
        run: make migrate-check
      - run: make test-integration
      - run: make infra-down
        if: always()

  images:
    name: images build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    strategy:
      matrix:
        image: [api, maintenance]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build ${{ matrix.image }} without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  terraform:
    name: terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        root: [shared, environments/dev, environments/prod]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
      - run: terraform fmt -check -recursive deployment/terraform
      - run: terraform -chdir=deployment/terraform/${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=deployment/terraform/${{ matrix.root }} validate
