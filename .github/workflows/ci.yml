name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make setup
      - run: make check
      - name: the committed OpenAPI document is current
        run: make openapi && git diff --exit-code

  integration:
    name: integration over the compose stack
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: cp .env.example .env
      - run: make infra-up
      - run: make migrate
      - name: every role's ORM metadata matches the migrated schema
        run: make migrate-check
      - run: make test-integration
      - run: make infra-down
        if: always()

  images:
    name: images build
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        image: [api, maintenance]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.image }} without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  terraform:
    name: terraform format and validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [shared, environments/dev, environments/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - run: terraform fmt -check -recursive deployment/terraform
      - run: terraform -chdir=deployment/terraform/${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=deployment/terraform/${{ matrix.root }} validate
