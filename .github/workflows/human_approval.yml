# A pause with two buttons. The one job binds to the `human_approval` GitHub
# environment, whose only protection rule is a required reviewer, so the run
# stops at this job until the reviewer presses Approve (the job passes) or
# Reject (the job fails and everything that needs it is skipped). Nothing
# else happens here: no checkout, no credentials.
#
# Any job of any workflow requires it in two lines:
#
#   human_approval:
#     uses: ./.github/workflows/human_approval.yml
#     with:
#       reason: what the reviewer is being asked to sanity check
#   apply:
#     needs: human_approval
#
# The reason appears in the job's name while the run waits, and in the job
# summary once it is approved.
name: human_approval

on:
  workflow_call:
    inputs:
      reason:
        description: What the reviewer is being asked to check before the run goes on.
        type: string
        required: false
        default: ""

jobs:
  human_approval:
    name: "human approval${{ inputs.reason != '' && ': ' || '' }}${{ inputs.reason }}"
    runs-on: ubuntu-latest
    environment: human_approval
    steps:
      - name: record the approval
        env:
          REASON: ${{ inputs.reason }}
        run: |
          echo "Approved by a required reviewer of the \`human_approval\` environment." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REASON" ]; then
            printf '\nReason: %s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
