# Production is the `release` branch, moved only by a fast-forward from
# `main` (release.yml). A push to `release` plans production, waits for a
# person's approval on that plan, and applies exactly it. Nothing is built
# here: the images are the digests staging tagged with this commit and the
# portal is the build staging kept for it, so a release commit staging never
# built is refused before anything is planned, and `release` must be an
# ancestor of `main`, or someone committed to it.
#
# Production has an AWS account of its own (deployment/cloud/environments.json)
# and reads nothing from staging's. What it releases are the copies staging's
# account replicates into it: every image, digest for digest, into
# production's registry, and every portal build into production's artifacts
# bucket. A commit staging built before the replication was on has no copy
# here and is refused the same way.
#
# The approval gates the credential, not only the step. Two roles stand
# behind this workflow, both in production's account and declared by
# deployment/terraform/bootstrap/prod, each trusting exactly one subject:
#
#   environment:production-plan -> tadas-plan-production    reads and plans
#   environment:production      -> tadas-deploy-production  applies
#
# `resolve` and `plan` run before anyone approves, so they declare
# `production-plan` and hold a credential that can change nothing: it reads
# production, takes the state lock while it plans, and writes the plan file.
# `apply` declares `production`, whose required reviewer is the approval, and
# a job that has not waited there never produces the subject the applying
# role trusts. The plan is in the `plan` job's summary and in the
# `production-plan` artifact.
#
# Each of the two GitHub environments holds its own variables under the same
# names: AWS_ROLE_ARN is the plan role in `production-plan` and the deploy
# role in `production`. scripts/cloud_create.sh production sets them.
#
# The state holds no secret value: the database password is written
# write-only, to the database and to its secret, and never lands in the state
# or a saved plan. A refresh still reads production's secrets through the
# secret store, which the plan role is granted for that. What it cannot do is
# change production, and that is the line the approval holds.
#
# Inside the apply the migration runs as a one-off task on the new API image
# before the services roll (the service module orders it); a migration that
# fails ends the apply with the old tasks still serving, and the apply waits
# until the new tasks serve, so a rollout ECS rolls back fails the job.
#
# The saved plan goes to the state bucket, next to the state it was computed
# against and under the same access: a plan file carries sensitive values
# unmasked, and a workflow artifact of a public repository is downloadable
# by anyone. The text rendering, in which Terraform masks them, is the
# reviewer's copy.
name: deploy-production

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # The guard reads the production environment's protection rules.
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The region deployment/cloud/environments.json names; a test holds them
  # equal.
  AWS_REGION: us-west-2
  TERRAFORM_VERSION: "1.16.3"

jobs:
  guard:
    name: release is a prefix of main and the cloud is configured
    runs-on: ubuntu-latest
    # To read the plan environment's variables. No rule on it, and this job
    # assumes no role.
    environment: production-plan
    steps:
      - name: this is the release branch
        if: github.ref != 'refs/heads/release'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::production deploys from refs/heads/release only, not $REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: release is an ancestor of main
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "\`$SHA\` is on \`main\`: release is a prefix of main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::$SHA is not an ancestor of main. release moves only by a fast-forward from main (release.yml); a commit made on release is not deployed. Reset release to a main commit and dispatch release.yml."
            exit 1
          fi
      # The approval gate is a setting outside the repository; this makes its
      # absence a failed run instead of an unreviewed apply.
      - name: the production environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! rules="$(gh api "repos/$REPOSITORY/environments/production" --jq '[.protection_rules[]? | .type] | join(",")' 2>&1)"; then
            echo "::error::the production environment cannot be read ($rules): create it with a required reviewer (the deploy runbook) before releasing"
            exit 1
          fi
          case ",$rules," in
            *,required_reviewers,*)
              echo "The \`production\` environment requires a reviewer; the apply waits for one." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::the production environment has no required-reviewers rule (rules: '$rules'); without it the apply would run unreviewed. Add the reviewer (the deploy runbook) before releasing."
              exit 1 ;;
          esac
      - name: the cloud is configured
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          missing=""
          for name in AWS_ROLE_ARN TF_STATE_BUCKET ARTIFACTS_BUCKET API_DOMAIN_NAME APP_DOMAIN_NAME ALARM_EMAIL; do
            [ -n "${!name}" ] || missing="${missing:+$missing, }$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the production-plan environment's variables $missing are empty: there is no cloud to release to (scripts/cloud_create.sh production sets them)"
            exit 1
          fi

  resolve:
    name: what staging built for this commit
    needs: guard
    runs-on: ubuntu-latest
    # No rule on this environment: it is how the job presents a subject the
    # read-only role trusts, before there is anything to approve.
    environment: production-plan
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      maintenance_image: ${{ steps.images.outputs.maintenance_image }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr
      - name: the image digests staging tagged with this commit
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          # Replication is asynchronous and usually done in seconds, so a copy
          # that is not here yet is waited for, a bounded ten minutes, before
          # it is refused.
          resolve() {
            local digest="" attempt
            for attempt in $(seq 1 20); do
              digest="$(aws ecr describe-images --repository-name "$1" \
                --image-ids "imageTag=$SHA" \
                --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
              if [ -n "$digest" ] && [ "$digest" != "None" ]; then break; fi
              digest=""
              [ "$attempt" = 20 ] || sleep 30
            done
            if [ -z "$digest" ]; then
              # To stderr: the function is called in a command substitution,
              # so anything on stdout is captured into the image variable and
              # the annotation the runbook tells operators to look for never
              # reaches the log.
              echo "::error::$1 has no image tagged $SHA in production's registry: staging never built this commit, or built it before the replication into production was on. Release a commit deploy-staging built after that." >&2
              exit 1
            fi
            echo "$REGISTRY/$1@$digest"
          }
          api_image="$(resolve tadas-api)"
          maintenance_image="$(resolve tadas-maintenance)"
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "maintenance_image=$maintenance_image" >> "$GITHUB_OUTPUT"
          echo "Images staging built for \`$SHA\`: \`$api_image\`, \`$maintenance_image\`." >> "$GITHUB_STEP_SUMMARY"
      - name: the portal build staging kept for this commit
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            if aws s3api head-object --bucket "$ARTIFACTS_BUCKET" --key "builds/portal/$SHA/index.html" >/dev/null 2>&1; then
              echo "Portal: \`s3://$ARTIFACTS_BUCKET/builds/portal/$SHA\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$attempt" = 20 ] || sleep 30
          done
          echo "::error::production's artifacts bucket holds no portal build under builds/portal/$SHA after ten minutes: staging never built this commit, or built it before the replication into production was on."
          exit 1

  plan:
    name: plan production
    needs: resolve
    runs-on: ubuntu-latest
    environment: production-plan
    outputs:
      plan_key: ${{ steps.plan.outputs.plan_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: plan production
        id: plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          # Empty (unset) leaves browser error reporting off, the root default.
          PORTAL_SENTRY_DSN: ${{ vars.PORTAL_SENTRY_DSN }}
          API_IMAGE: ${{ needs.resolve.outputs.api_image }}
          MAINTENANCE_IMAGE: ${{ needs.resolve.outputs.maintenance_image }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          terraform -chdir=deployment/terraform/environments/prod init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=environments/prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          terraform -chdir=deployment/terraform/environments/prod plan -input=false -out=tfplan \
            -var "api_image=$API_IMAGE" \
            -var "maintenance_image=$MAINTENANCE_IMAGE" \
            -var "alarm_email=$ALARM_EMAIL" \
            -var "api_domain_name=$API_DOMAIN_NAME" \
            -var "app_domain_name=$APP_DOMAIN_NAME" \
            -var "portal_sentry_dsn=$PORTAL_SENTRY_DSN"
          terraform -chdir=deployment/terraform/environments/prod show -no-color tfplan > plan.txt
          plan_key="plans/environments/prod/$SHA-$RUN.tfplan"
          aws s3 cp deployment/terraform/environments/prod/tfplan "s3://$TF_STATE_BUCKET/$plan_key"
          echo "plan_key=$plan_key" >> "$GITHUB_OUTPUT"
          {
            echo "## production plan for \`$SHA\`"
            echo ""
            echo "Images: \`$API_IMAGE\`, \`$MAINTENANCE_IMAGE\`."
            echo ""
            grep -E '^(Plan:|No changes\.)' plan.txt || echo "See the plan below."
            echo ""
            echo "<details><summary>terraform show</summary>"
            echo ""
            echo '```'
            head -c 900000 plan.txt
            [ "$(wc -c < plan.txt)" -le 900000 ] || echo "... (truncated; the production-plan artifact holds the whole text)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-plan
          path: plan.txt
          if-no-files-found: error
          retention-days: 90

  apply:
    name: apply the approved plan, migrate, and publish
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The guard read the plan environment's variables; these are this
      # environment's own, and an empty one fails here, before any change.
      - name: the production environment is configured
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          missing=""
          for name in AWS_ROLE_ARN TF_STATE_BUCKET ARTIFACTS_BUCKET; do
            [ -n "${!name}" ] || missing="${missing:+$missing, }$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the production environment's variables $missing are empty (scripts/cloud_create.sh production sets them)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # Before anything changes: the registry's lifecycle keeps the images
      # tagged `prod-`, so the digests production is about to run are never
      # expired under it. The digest is named, so a manifest that came back
      # altered is refused rather than tagged as a new image.
      - name: keep the promoted images
        env:
          API_IMAGE: ${{ needs.resolve.outputs.api_image }}
          MAINTENANCE_IMAGE: ${{ needs.resolve.outputs.maintenance_image }}
          SHA: ${{ github.sha }}
        run: |
          keep() {
            local image="$1" repository digest manifest media out
            repository="${image%@*}"
            repository="${repository#*/}"
            digest="${image##*@}"
            manifest="$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids "imageDigest=$digest" --query 'images[0].imageManifest' --output text)"
            media="$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids "imageDigest=$digest" --query 'images[0].imageManifestMediaType' --output text)"
            if ! out="$(aws ecr put-image --repository-name "$repository" --image-tag "prod-$SHA" \
                --image-digest "$digest" --image-manifest "$manifest" \
                --image-manifest-media-type "$media" 2>&1)"; then
              case "$out" in
                *ImageAlreadyExistsException*) echo "$repository@$digest is tagged prod-$SHA already" ;;
                *) echo "$out" >&2; exit 1 ;;
              esac
            fi
          }
          keep "$API_IMAGE"
          keep "$MAINTENANCE_IMAGE"
      # Exactly the approved plan: Terraform refuses it once the state moved.
      # The migration runs inside, on the new API task definition, before
      # either service rolls.
      - name: apply the approved plan (migrate, then roll)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          terraform -chdir=deployment/terraform/environments/prod init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=environments/prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          aws s3 cp "s3://$TF_STATE_BUCKET/$PLAN_KEY" deployment/terraform/environments/prod/tfplan
          terraform -chdir=deployment/terraform/environments/prod apply -input=false tfplan
      - name: fetch the portal build staging kept for this commit
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          SHA: ${{ github.sha }}
        run: aws s3 sync "s3://$ARTIFACTS_BUCKET/builds/portal/$SHA" portal-dist
      - name: publish the same portal to production
        run: scripts/deploy_portal.sh deployment/terraform/environments/prod portal-dist
      # After the rollout, readiness is asked once more, through the edge: the
      # load balancer probes liveness only, so this is where a new release
      # that cannot reach its storage fails the run. It never replaces a task.
      - name: the new release is ready
        run: |
          API_DOMAIN_NAME="$(jq -er .environments.production.api_domain_name deployment/cloud/environments.json)"
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://$API_DOMAIN_NAME/readyz" >/dev/null; then
              echo "\`https://$API_DOMAIN_NAME/readyz\` answers ready." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::https://$API_DOMAIN_NAME/readyz did not answer ready within the rollout's grace; the release is serving but not ready."
          exit 1
