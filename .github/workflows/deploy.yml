# Dev builds and pushes both images by digest, builds the portal once, and
# applies and publishes its environment. Production never rebuilds: behind the
# `production` environment's approval gate it applies the same digests and
# publishes the same portal files dev already served. The portal build holds no
# environment; each environment's /config.json, written by Terraform, does.
#
# Credentials come from the deploy role in deployment/terraform/shared through
# GitHub's OIDC provider; the role's ARN and the state bucket are repository
# variables. The public names are variables too: DNS_ZONE_NAME (e.g. tadas.fyi)
# for the repository, and API_DOMAIN_NAME and APP_DOMAIN_NAME per GitHub
# environment (dev-api.tadas.fyi and dev-app.tadas.fyi in `dev`,
# api.tadas.fyi and app.tadas.fyi in `production`).
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.16.3"

jobs:
  portal:
    name: build the portal once
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tadas/portal build
      - uses: actions/upload-artifact@v7
        with:
          name: portal
          path: apps/portal/dist
          if-no-files-found: error
          retention-days: 30

  dev:
    name: build, push, and apply dev
    needs: portal
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      maintenance_image: ${{ steps.images.outputs.maintenance_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v4
      - name: build and push the api image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/api.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/tadas-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: build and push the maintenance image
        id: maintenance
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/maintenance.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/tadas-maintenance:${{ github.sha }}
          cache-from: type=gha,scope=maintenance
          cache-to: type=gha,scope=maintenance,mode=max
      - name: name the images by digest
        id: images
        run: |
          echo "api_image=${{ steps.ecr.outputs.registry }}/tadas-api@${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "maintenance_image=${{ steps.ecr.outputs.registry }}/tadas-maintenance@${{ steps.maintenance.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: apply dev
        run: |
          terraform -chdir=deployment/terraform/environments/dev init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=deployment/terraform/environments/dev apply -input=false -auto-approve \
            -var "api_image=${{ steps.images.outputs.api_image }}" \
            -var "maintenance_image=${{ steps.images.outputs.maintenance_image }}" \
            -var "dns_zone_name=${{ vars.DNS_ZONE_NAME }}" \
            -var "api_domain_name=${{ vars.API_DOMAIN_NAME }}" \
            -var "app_domain_name=${{ vars.APP_DOMAIN_NAME }}"
      - name: migrate dev
        run: scripts/cloud_migrate.sh deployment/terraform/environments/dev
      - uses: actions/download-artifact@v8
        with:
          name: portal
          path: portal-dist
      - name: publish the portal to dev
        run: scripts/deploy_portal.sh deployment/terraform/environments/dev portal-dist

  production:
    name: promote the same digests and portal to production
    needs: [portal, dev]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: apply production with dev's digests
        run: |
          terraform -chdir=deployment/terraform/environments/prod init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=deployment/terraform/environments/prod apply -input=false -auto-approve \
            -var "api_image=${{ needs.dev.outputs.api_image }}" \
            -var "maintenance_image=${{ needs.dev.outputs.maintenance_image }}" \
            -var "dns_zone_name=${{ vars.DNS_ZONE_NAME }}" \
            -var "api_domain_name=${{ vars.API_DOMAIN_NAME }}" \
            -var "app_domain_name=${{ vars.APP_DOMAIN_NAME }}"
      - name: migrate production
        run: scripts/cloud_migrate.sh deployment/terraform/environments/prod
      - uses: actions/download-artifact@v8
        with:
          name: portal
          path: portal-dist
      - name: publish the same portal to production
        run: scripts/deploy_portal.sh deployment/terraform/environments/prod portal-dist
