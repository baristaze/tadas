# Staging is `main`. Every green `ci` run on `main` deploys it, with no
# approval: the images are built once and pushed tagged by the commit,
# the portal is built once and kept by the commit, and staging is planned
# and applied in one job. Inside the apply the migration runs as a one-off
# task on the new API image before the services roll (the service module
# orders it), so a migration that fails ends the apply with the old tasks
# still serving. A migration is compatible with the release before it
# (expand and contract), so the old tasks serve the new schema meanwhile.
#
# Production (deploy-production.yml) never rebuilds: it resolves the digests
# tagged here and the portal files kept here, by the commit `release` points
# at. The portal build holds no environment; each environment's /config.json,
# written by Terraform, does.
#
# Credentials come from the staging deploy role in
# deployment/terraform/shared through GitHub's OIDC provider. That role is
# staging's and no more: it trusts one subject, a job of this repository that
# declares `environment: staging` and runs on `main`, and its permissions stop
# at what staging owns. Production's state, secrets, and database are outside
# it, which is what lets a merge deploy with no approval. Every job here that
# touches the cloud therefore declares the environment; a job without it
# presents its branch instead and is refused by the role's trust.
#
# The role's ARN and the state bucket are repository variables, and so is the
# zone (DNS_ZONE_NAME, e.g. tadas.fyi). The public names follow the zone:
# api.staging.<zone> and app.staging.<zone> here, api.<zone> and app.<zone>
# in production.
#
# Until those repository variables are set there is no cloud to deploy to:
# the `cloud` job says so in its summary and every job that touches the cloud
# is skipped, so the run stays green and the portal still builds.
name: deploy-staging

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.16.3"

jobs:
  cloud:
    name: is the cloud configured?
    # `ci` runs on every pull request, and `branches:` above filters on the
    # triggering run's head branch alone: a pull request opened from a fork's
    # `main` matches it. A `workflow_run` always runs in the base repository,
    # with its variables and its OIDC identity, so without the two checks
    # below a fork's commit would be built and applied under staging's own
    # credential. Only a push to this repository deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # The commit is the one `ci` ran, never the branch tip at the time this
      # run starts; a dispatch deploys the ref it was dispatched on.
      - name: resolve the commit
        id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$SHA\` to staging." >> "$GITHUB_STEP_SUMMARY"
      - name: check the repository variables
        id: check
        env:
          AWS_STAGING_ROLE_ARN: ${{ vars.AWS_STAGING_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DNS_ZONE_NAME: ${{ vars.DNS_ZONE_NAME }}
        run: |
          missing=""
          for name in AWS_STAGING_ROLE_ARN TF_STATE_BUCKET DNS_ZONE_NAME; do
            [ -n "${!name}" ] || missing="${missing:+$missing, }$name"
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "The cloud deployment is configured: staging deploys under \`$AWS_STAGING_ROLE_ARN\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "**The cloud deployment is not configured.** The repository variables \`$missing\` are empty, so every job that touches the cloud is skipped; only the portal builds. Set them once the account exists (deployment/terraform/shared)." >> "$GITHUB_STEP_SUMMARY"
          fi

  images:
    name: build and push the images by the commit
    needs: cloud
    if: needs.cloud.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      maintenance_image: ${{ steps.images.outputs.maintenance_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cloud.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The tag is the commit, and the repositories are immutable: a second
      # push of a tag that exists is refused (the provenance attestation alone
      # makes the manifest differ, so even an identical build is a new push).
      # A rerun after the apply failed, or a dispatch on a commit staging
      # already built, therefore resolves the digest that is there instead of
      # building again, the way deploy-production always does.
      - name: the digests already tagged with this commit, if any
        id: existing
        env:
          SHA: ${{ needs.cloud.outputs.sha }}
        run: |
          for name in api maintenance; do
            digest="$(aws ecr describe-images --repository-name "tadas-$name" \
              --image-ids "imageTag=$SHA" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
            if [ "$digest" = "None" ]; then digest=""; fi
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            if [ -n "$digest" ]; then
              echo "\`tadas-$name\` is already tagged \`$SHA\`; it is not built again." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: build and push the api image
        id: api
        if: steps.existing.outputs.api == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/docker/api.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/tadas-api:${{ needs.cloud.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: build and push the maintenance image
        id: maintenance
        if: steps.existing.outputs.maintenance == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/docker/maintenance.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/tadas-maintenance:${{ needs.cloud.outputs.sha }}
          cache-from: type=gha,scope=maintenance
          cache-to: type=gha,scope=maintenance,mode=max
      - name: name the images by digest
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_DIGEST: ${{ steps.api.outputs.digest || steps.existing.outputs.api }}
          MAINTENANCE_DIGEST: ${{ steps.maintenance.outputs.digest || steps.existing.outputs.maintenance }}
        run: |
          echo "api_image=$REGISTRY/tadas-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "maintenance_image=$REGISTRY/tadas-maintenance@$MAINTENANCE_DIGEST" >> "$GITHUB_OUTPUT"

  portal:
    name: build the portal once
    needs: cloud
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cloud.outputs.sha }}
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tadas/portal build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal
          path: apps/portal/dist
          if-no-files-found: error
          retention-days: 30
      # The build is kept by the commit in the state bucket, which is where
      # production reads it from: a workflow artifact expires and is one
      # run's, the bucket outlives both and is reachable by the commit alone.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: needs.cloud.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: keep the build by the commit
        if: needs.cloud.outputs.configured == 'true'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          SHA: ${{ needs.cloud.outputs.sha }}
        run: aws s3 sync apps/portal/dist "s3://$TF_STATE_BUCKET/builds/portal/$SHA" --delete

  staging:
    name: plan and apply staging, migrate, and publish
    needs: [cloud, images, portal]
    if: needs.cloud.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cloud.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: plan staging
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DNS_ZONE_NAME: ${{ vars.DNS_ZONE_NAME }}
          API_IMAGE: ${{ needs.images.outputs.api_image }}
          MAINTENANCE_IMAGE: ${{ needs.images.outputs.maintenance_image }}
        run: |
          terraform -chdir=deployment/terraform/environments/staging init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=environments/staging/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          terraform -chdir=deployment/terraform/environments/staging plan -input=false -out=tfplan \
            -var "api_image=$API_IMAGE" \
            -var "maintenance_image=$MAINTENANCE_IMAGE" \
            -var "dns_zone_name=$DNS_ZONE_NAME" \
            -var "api_domain_name=api.staging.$DNS_ZONE_NAME" \
            -var "app_domain_name=app.staging.$DNS_ZONE_NAME"
          terraform -chdir=deployment/terraform/environments/staging show -no-color tfplan > plan.txt
          {
            echo "## staging plan"
            echo ""
            echo "Images: \`$API_IMAGE\`, \`$MAINTENANCE_IMAGE\`."
            echo ""
            grep -E '^(Plan:|No changes\.)' plan.txt || echo "See the plan below."
            echo ""
            echo "<details><summary>terraform show</summary>"
            echo ""
            echo '```'
            head -c 900000 plan.txt
            [ "$(wc -c < plan.txt)" -le 900000 ] || echo "... (truncated; the staging-plan artifact holds the whole text)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-plan
          path: plan.txt
          if-no-files-found: error
          retention-days: 30
      # The migration runs inside this apply, on the new API task definition,
      # before either service rolls; the apply waits until the new tasks serve.
      - name: apply staging (migrate, then roll)
        run: terraform -chdir=deployment/terraform/environments/staging apply -input=false tfplan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portal
          path: portal-dist
      - name: publish the portal to staging
        run: scripts/deploy_portal.sh deployment/terraform/environments/staging portal-dist
