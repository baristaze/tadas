[project]
name = "tadas-maintenance"
version = "0.1.0"
description = "The Tadas maintenance worker: the claim loop and the sweep, ready for real kinds."
requires-python = ">=3.14"
dependencies = [
    "tadas-om",
    "tadas-infra",
    "pydantic-settings>=2.6",
]

[project.scripts]
tadas-maintenance = "tadas.workers.maintenance.main:main"

[tool.uv.sources]
tadas-om = { workspace = true }
tadas-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
