[project]
name = "tadas-cli"
version = "0.1.0"
description = "The Tadas command line: one command at a time, or a listener that prints what the team does as it happens."
requires-python = ">=3.14"
dependencies = [
    "tadas-client",
    "typer>=0.15",
]

[project.scripts]
tadas = "tadas.apps.cli.main:main"

[tool.uv.sources]
tadas-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
