# The portal is a single-page app: a path that is not a file is a client
# route, so it gets index.html. Hashed assets cache forever; the page never.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
