# The desired state of the WorkOS application Tadas signs people in
# through, per WorkOS environment. `uv run tadas-ops workos-bootstrap
# --environment <name>` reads it and reconciles WorkOS with it: a dry run by
# default, `--apply` to write.
#
# A WorkOS environment is not a Tadas environment. `staging` serves the
# local stack and Tadas's staging; `production` serves production alone.
# Each Tadas environment still accepts only its own callback: the API's
# TADAS_SIGN_IN_REDIRECT_URIS names it, and a deployed one refuses anything
# else.
#
# The client id is the Tadas App application's, and it is not a secret. The
# API key is, and it is that application's own key (Applications, Tadas
# App, API keys), never the environment's (API Keys): the command proves
# it before anything else, reads it from the variable named here, and never
# prints it. The key reads and writes the application's redirect list.
# The Redirects tab's other fields have no API; the command prints them as
# checks to make on the tab. The sign-out URIs are among them: where WorkOS's
# logout sends a person once the sign-out has ended their AuthKit session.
# Each Tadas environment names its own in TADAS_SIGN_OUT_RETURN_URIS, and the
# API refuses any other return.

staging:
  api_key_variable: WORKOS_API_KEY
  client_id: client_01M3640D8WBF9KC0P89YW4E72N
  redirect_uris:
    - http://localhost:55173/auth/callback
    - http://localhost:5173/auth/callback
    - https://app.staging.tadas.fyi/auth/callback
  # The deployed callback, so nothing WorkOS sends on its own lands on a
  # laptop's port.
  default_redirect_uri: https://app.staging.tadas.fyi/auth/callback
  login_initiation_uri: https://app.staging.tadas.fyi/login
  app_homepage_url: https://app.staging.tadas.fyi
  sign_out_uris:
    - http://localhost:55173/signed-out
    - http://localhost:5173/signed-out
    - https://app.staging.tadas.fyi/signed-out
  # The deployed page, for the same reason as the default redirect.
  default_sign_out_uri: https://app.staging.tadas.fyi/signed-out
  # The sign-in and the invitations need no webhook.
  webhooks: []

production:
  api_key_variable: WORKOS_PRODUCTION_API_KEY
  client_id: client_01M363XVP5FGF2P45FHK9B7MJD
  redirect_uris:
    - https://app.tadas.fyi/auth/callback
  default_redirect_uri: https://app.tadas.fyi/auth/callback
  login_initiation_uri: https://app.tadas.fyi/login
  app_homepage_url: https://app.tadas.fyi
  sign_out_uris:
    - https://app.tadas.fyi/signed-out
  default_sign_out_uri: https://app.tadas.fyi/signed-out
  # The sign-in and the invitations need no webhook.
  webhooks: []
