# The local stack plus the application containers: the API on TADAS_PORT
# (8000), the maintenance worker, and the portal on TADAS_PORTAL_PORT (55173).
# `make stack-up` runs:
#   docker compose -f deployment/local/docker-compose.yml -f deployment/local/docker-compose.full.yml up
name: tadas

x-app-env: &app-env
  TADAS_ENVIRONMENT: local
  # The runtime login and the system login, as a deployed task holds them;
  # neither the migration login nor the master is ever a container's. Each
  # role's URL puts it on its own instance, and both logins follow it there.
  TADAS_DATABASE_URL: postgresql+asyncpg://tadas_runtime:tadas_runtime@postgres-core:5432/tadas
  TADAS_DATABASE_SYSTEM_URL: postgresql+asyncpg://tadas_system:tadas_system@postgres-core:5432/tadas
  TADAS_DATABASE_URL_CORE: postgresql+asyncpg://tadas_runtime:tadas_runtime@postgres-core:5432/tadas
  TADAS_DATABASE_URL_ACTIVITY: postgresql+asyncpg://tadas_runtime:tadas_runtime@postgres-activity:5432/tadas
  TADAS_DATABASE_URL_QUEUE: postgresql+asyncpg://tadas_runtime:tadas_runtime@postgres-queue:5432/tadas
  TADAS_DATABASE_URL_ADMIN: postgresql+asyncpg://tadas_runtime:tadas_runtime@postgres-admin:5432/tadas
  TADAS_CACHE_BACKEND: valkey
  TADAS_TOPICS_BACKEND: valkey
  TADAS_VALKEY_URL: valkey://valkey:6379/0
  TADAS_BUCKETS_BACKEND: s3
  TADAS_S3_ENDPOINT_URL: http://minio:9000
  # A presigned URL is followed by the browser, on the host, so it names the
  # host port; the containers still talk to minio:9000.
  TADAS_S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:${TADAS_MINIO_PORT:-59000}
  TADAS_S3_ACCESS_KEY: tadas
  TADAS_S3_SECRET_KEY: tadas-minio-local
  TADAS_QUEUES_BACKEND: sqs
  TADAS_SQS_ENDPOINT_URL: http://elasticmq:9324
  TADAS_SECRETS_BACKEND: local
  TADAS_SECRETS_FILE: /run/tadas/secrets.env
  # No rules file in the container: every flag reads its default.
  TADAS_FLAGS_BACKEND: memory
  TADAS_FLAGS_FILE: /run/tadas/flags.json
  TADAS_AWS_REGION: us-east-1
  TADAS_LOG_JSON: "true"
  # Traces to Jaeger and errors to GlitchTip, both in the devx profile; without
  # it, export and report attempts fail quietly.
  TADAS_OTEL_ENDPOINT: http://jaeger:4318
  TADAS_SENTRY_DSN: http://0123456789abcdef0123456789abcdef@glitchtip:8000/1
  TADAS_CORS_ORIGINS: '["http://localhost:${TADAS_PORTAL_PORT:-55173}","http://127.0.0.1:${TADAS_PORTAL_PORT:-55173}"]'
  # The payment processor: the sandbox account, and the runtime key and the
  # signing secret from .env or the shell, empty by default, which leaves billing
  # unconfigured (every org keeps its plan; a checkout answers 503).
  TADAS_BILLING_BACKEND: ${TADAS_BILLING_BACKEND:-stripe}
  TADAS_STRIPE_ACCOUNT_ID: ${TADAS_STRIPE_ACCOUNT_ID:-acct_1UIfVX45a2t9JoiY}
  TADAS_STRIPE_RUNTIME_KEY: ${TADAS_STRIPE_RUNTIME_KEY:-}
  TADAS_STRIPE_WEBHOOK_SECRET: ${TADAS_STRIPE_WEBHOOK_SECRET:-}

services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/api.Dockerfile
    environment:
      <<: *app-env
      TADAS_HOST: 0.0.0.0
      TADAS_PORT: "8000"
      # Sign-in through the Tadas App, the WorkOS staging environment's
      # application, whose redirects include this stack's portal. The key and
      # the webhook secret are that application's own, from the shell or
      # .env, never written here. Without the key, WorkOS answers 503 and the
      # local sign-in by address still works; with a key of another
      # application, the API refuses to start.
      TADAS_IDENTITY_PROVIDER: workos
      TADAS_WORKOS_CLIENT_ID: ${TADAS_WORKOS_CLIENT_ID:-client_01M3640D8WBF9KC0P89YW4E72N}
      TADAS_WORKOS_API_KEY: ${TADAS_WORKOS_API_KEY:-}
      TADAS_WORKOS_WEBHOOK_SECRET: ${TADAS_WORKOS_WEBHOOK_SECRET:-}
      # A sign-in and a sign-out come back to the portal: this stack's, on
      # its port, or the Vite dev server's.
      TADAS_SIGN_IN_REDIRECT_URIS: '["http://localhost:${TADAS_PORTAL_PORT:-55173}/auth/callback","http://localhost:5173/auth/callback"]'
      TADAS_SIGN_OUT_RETURN_URIS: '["http://localhost:${TADAS_PORTAL_PORT:-55173}/signed-out","http://localhost:5173/signed-out"]'
      TADAS_DEV_SIGN_IN_ENABLED: "true"
    ports:
      - "127.0.0.1:${TADAS_PORT:-8000}:8000"
    depends_on: &on-the-stack
      postgres-core:
        condition: service_healthy
      postgres-activity:
        condition: service_healthy
      postgres-queue:
        condition: service_healthy
      postgres-admin:
        condition: service_healthy
      valkey:
        condition: service_healthy

  maintenance:
    build:
      context: ../..
      dockerfile: deployment/docker/maintenance.Dockerfile
    environment:
      <<: *app-env
      TADAS_METRICS_HOST: 0.0.0.0
      # The same Tadas App as the API's: the worker deletes a deleted
      # account's person there. Without the key, that step waits, and the
      # account's personal org waits with it.
      TADAS_IDENTITY_PROVIDER: workos
      TADAS_WORKOS_CLIENT_ID: ${TADAS_WORKOS_CLIENT_ID:-client_01M3640D8WBF9KC0P89YW4E72N}
      TADAS_WORKOS_API_KEY: ${TADAS_WORKOS_API_KEY:-}
    depends_on: *on-the-stack

  # The browser loads the portal from the host and calls the API on the
  # portal's own origin: the container forwards /v1 to the api service. It
  # reaches GlitchTip on a host port, so that build argument is a host
  # address, not a service name.
  portal:
    build:
      context: ../..
      dockerfile: deployment/docker/portal.Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SENTRY_DSN: http://0123456789abcdef0123456789abcdef@localhost:${TADAS_GLITCHTIP_PORT:-58000}/1
    ports:
      - "127.0.0.1:${TADAS_PORTAL_PORT:-55173}:8080"
    depends_on:
      api:
        condition: service_healthy
