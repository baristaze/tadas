# The inbound queues the cloud's queue module declares, here too: one per
# member of `Queues`, named `<prefix><queue>` with the prefix of
# .env.example, each with its dead-letter queue, the `-dead` suffix the SQS
# impl resolves it by.
include classpath("application.conf")

queues {
  tadas-webhooks-dead {}
  tadas-webhooks {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "tadas-webhooks-dead"
      maxReceiveCount = 5
    }
  }
}
