# The local queues: every queue in tadas.infra.queues.Queues under the local
# prefix (TADAS_SQS_QUEUE_PREFIX=tadas-), each with a dead-letter queue after
# five receives, as the queue module declares them in the cloud. The
# include keeps the image's defaults: the SQS API on 0.0.0.0:9324.
include classpath("application.conf")

queues {
  tadas-webhooks-dead {}
  tadas-webhooks {
    deadLettersQueue {
      name = "tadas-webhooks-dead"
      maxReceiveCount = 5
    }
  }
  tadas-slack-dead {}
  tadas-slack {
    deadLettersQueue {
      name = "tadas-slack-dead"
      maxReceiveCount = 5
    }
  }
}
