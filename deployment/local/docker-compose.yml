# Every technology piece Tadas depends on, as a local container.
# Application processes run on the host; see scripts/dev.sh.
# Host ports sit in the 5xxxx range so the stack coexists with other
# local stacks; inside the network the containers use their own ports.
# The `devx` profile adds developer dashboards over the same services:
#   docker compose -f deployment/local/docker-compose.yml --profile devx up -d
name: tadas

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tadas
      POSTGRES_PASSWORD: tadas
      POSTGRES_DB: tadas
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadas -d tadas"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:9.1-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:59324:9324"
    healthcheck:
      # 1.7 dropped the built-in stats UI on 9325; probe the SQS API itself.
      test: ["CMD-SHELL", "wget -q -O- 'http://127.0.0.1:9324/?Action=ListQueues' >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tadas
      MINIO_ROOT_PASSWORD: tadastadas
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Developer dashboards (profile devx). Local only; none of them has auth.

  pgweb:
    image: sosedoff/pgweb:0.17.0
    profiles: [devx]
    environment:
      PGWEB_DATABASE_URL: postgres://tadas:tadas@postgres:5432/tadas?sslmode=disable
    ports:
      - "127.0.0.1:58081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  valkey-admin:
    image: valkey/valkey-admin:1.1.1
    profiles: [devx]
    environment:
      DEPLOYMENT_MODE: Web
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      valkey:
        condition: service_healthy

  elasticmq-ui:
    image: softwaremill/elasticmq-ui:1.7.1
    profiles: [devx]
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:53000:3000"
    depends_on:
      elasticmq:
        condition: service_healthy

  # Traces: set TADAS_OTEL_ENDPOINT=http://127.0.0.1:54318 for host processes.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [devx]
    ports:
      - "127.0.0.1:56686:16686"
      - "127.0.0.1:54318:4318"

volumes:
  postgres:
  minio:
