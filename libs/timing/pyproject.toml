[project]
name = "tadas-timing"
version = "0.1.0"
description = "The Tadas waits: one growing, capped retry wait, a server's Retry-After, and a loop's fixed period."
requires-python = ">=3.14"
# A leaf: every distribution may import it, the client included, so it
# depends on nothing.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
