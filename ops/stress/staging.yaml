# The deployed scenario: three minutes at the regular profile against a
# cloud environment. Smoke's numbers are a laptop's, and a deployed
# environment does not make them: the edge is a load balancer, the
# database is across a network, and a request costs more.
#
# The target is what the environment does, not what it should do. This
# 900 ms came from runs that signed in around every session and held
# the target to a p95 over those sign-ins as well, so it is stale: it
# was set to sit above a sign-in's cost, and the p95 it now judges is
# the working requests' alone. It stays as it is until the first run of
# the new shape measures one, and that run sets it, downward.
name: staging
profile: regular
duration_seconds: 180
ramp_seconds: 30
target:
  p95_ms: 900
  error_ratio: 0.01
weights:
  list_open_tasks: 5
  list_done_tasks: 2
  create_task: 3
  update_task: 2
  complete_task: 2
  reopen_task: 1
  move_task: 1
  delete_task: 1
  list_events: 2
