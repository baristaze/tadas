# The deployed scenario: three minutes at the regular profile against a
# cloud environment. Smoke's numbers are a laptop's, and a deployed
# environment does not make them: the edge is a load balancer, the
# database is across a network, and a request costs more.
#
# These numbers are illustrative. The scenario exists to show the shape
# of a stress test: a profile, a ramp, a soak, a target stated before the
# run, and the signals read back after it. It does not state what good
# performance is, here or anywhere.
#
# The target below is sized for staging as it is deployed: one API task
# on half a vCPU (deployment/terraform/environments/staging/main.tf). So
# 3000 ms is a number about that size, not about the platform: a bigger
# task moves it.
#
# A team adopting this sets its own target, from its own traffic and its
# own size. The stricter target is the interesting run: dispatch
# stress.yml with p95_ms as an input, or pass --p95-ms, and the run
# judges that number and says it came from the run and not from here.
name: staging
profile: regular
duration_seconds: 180
ramp_seconds: 30
target:
  p95_ms: 3000
  error_ratio: 0.01
weights:
  list_open_tasks: 5
  list_done_tasks: 2
  create_task: 3
  update_task: 2
  complete_task: 2
  reopen_task: 1
  move_task: 1
  delete_task: 1
  list_events: 2
