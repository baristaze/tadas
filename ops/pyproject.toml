[project]
name = "tadas-ops"
version = "0.1.0"
description = "The Tadas operations package: the traffic generator, the stress test, and the signal readers."
requires-python = ">=3.14"
dependencies = [
    "tadas-client",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "aioboto3>=15.5",
]

[project.scripts]
tadas-ops = "tadas.ops.main:main"

[tool.uv.sources]
tadas-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
