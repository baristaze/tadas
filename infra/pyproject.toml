[project]
name = "tadas-infra"
version = "0.1.0"
description = "Tadas infrastructure capabilities: cache, buckets, topics, queues, secrets, observability."
requires-python = ">=3.14"
dependencies = [
    "tadas-om",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "aioboto3>=15.5",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "prometheus-client>=0.26",
    "truststore>=0.10.4",
    "valkey-glide>=2.5.2",
]

[tool.uv.sources]
tadas-om = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
