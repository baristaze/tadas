[project]
name = "tadas-infra"
version = "0.1.0"
description = "Tadas infrastructure capabilities: cache, buckets, topics, queues, secrets, observability."
requires-python = ">=3.14"
dependencies = [
    "tadas-om",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "aioboto3>=13.2",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
    "truststore>=0.10",
]

[tool.uv.sources]
tadas-om = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
