[project]
name = "tadas-integrations"
version = "0.1.0"
description = "Tadas third-party providers: one interface per provider, its real client, and a deterministic twin."
requires-python = ">=3.14"
dependencies = [
    "tadas-infra",
    "pydantic>=2.13",
    "aiohttp>=3.14",
    "slack-sdk>=3.36",
]

[tool.uv.sources]
tadas-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
