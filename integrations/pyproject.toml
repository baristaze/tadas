[project]
name = "tadas-integrations"
version = "0.1.0"
description = "Tadas third-party providers: each one an interface, a real client, and a deterministic twin."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "tadas-infra",
    "stripe==15.6.1",
    "httpx>=0.28.1",
]

[tool.uv.sources]
tadas-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
