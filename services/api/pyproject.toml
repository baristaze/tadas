[project]
name = "tadas-api"
version = "0.1.0"
description = "The Tadas API process: gateway, routers, realtime channel, and the ops CLI."
requires-python = ">=3.14"
dependencies = [
    "tadas-om",
    "tadas-infra",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic-settings>=2.15",
]

[project.scripts]
tadas-api = "tadas.services.api.main:main"

[tool.uv.sources]
tadas-om = { workspace = true }
tadas-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `tadas`, with no tadas/__init__.py (ADR 0001).
packages = ["src/tadas"]
